name: Build & Push FacturaScripts image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile']
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/surmod/docker-facturascripts

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          no-cache: true
          tags: ${{ env.IMAGE }}:inspect

      - name: Extract version info
        id: meta
        run: |
          PHP_VERSION=$(docker run --rm ${{ env.IMAGE }}:inspect php -r 'echo PHP_VERSION;')
          APP_VERSION=$(docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'echo ${FS_VERSION:-unknown}' 2>/dev/null)
          if [ "$APP_VERSION" = "unknown" ] || [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'grep -oP "\"version\":\s*\"\K[^\"]+\" " /var/www/html/facturascripts.ini 2>/dev/null || grep -oP "version.*=.*\K[0-9][0-9.]*" /var/www/html/facturascripts.ini 2>/dev/null || echo unknown')
            APP_VERSION=$(echo "$APP_VERSION" | head -1 | tr -d '[:space:]')
          fi
          APP_VERSION=${APP_VERSION:-unknown}
          echo "php=${PHP_VERSION}" >> $GITHUB_OUTPUT
          echo "app=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Built: FacturaScripts ${APP_VERSION} / PHP ${PHP_VERSION}"

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-php${{ steps.meta.outputs.php }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-php${{ steps.meta.outputs.php }}
